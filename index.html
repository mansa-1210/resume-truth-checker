<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resume Truth Checker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="container">
    <header class="topbar">
      <h2>Resume Truth Checker</h2>
      <div class="top-controls"></div>
    </header>

    <div class="main-card">
      <h3 style="margin:0 0 12px 0; color: #0f172a;">Upload Resume</h3>

      <div class="input-row">
      <div class="left-col">
        <div class="panel" id="pastePanel">
          <label for="resumeText" style="font-weight:700; display:block; margin-bottom:8px; color: #0f172a;">Paste Resume</label>
          <textarea id="resumeText" placeholder="Paste your resume here" ></textarea>
          <div class="row">
            <div class="charcount" id="charCount">0</div>
            <div class="actions">
              <button id="clearBtn" type="button">Clear</button>
            </div>
          </div>
        </div>
      </div>

      <div class="right-col">
        <div class="panel" id="uploadPanel">
          <div id="dropzone" class="dropzone"> 
            <div class="drop-content"> 
              <div class="cloud-icon">☁️</div>
              <div class="drop-text">Drag & Drop Resume Here</div>
              <div class="drop-sub">or <button id="browseBtn" class="link-btn">Browse Files</button></div>
              <div class="drop-note">Supported: PDF, DOC, DOCX, TXT — Max 5MB</div>
            </div>
          </div>
          <div style="margin-top:12px; text-align:center;"><button id="uploadBtn" class="primary">Upload Resume</button></div>
          <input id="fileInput" type="file" accept=".pdf,.doc,.docx,.txt" style="display:none" />
          <div id="uploadInfo" class="upload-info"></div>
        </div>

        <div class="panel actions-panel" style="margin-top:12px;">
          <div class="big-actions">
            <button id="analyzeBtn" type="button" disabled>Analyze</button>
          </div>
          <div id="loading" class="hidden">Analyzing &hellip;</div>
          <div id="error" class="hidden"></div>
        </div>
      </div>
    </div>

    <div id="results" class="hidden"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
